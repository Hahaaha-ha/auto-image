# ============================================================
# Deploy 统一配置
# 作用：deploy-guide / deploy-install / deploy-verify / deploy-archive 四个 agent 共用
# 位置：项目根目录 deploy.config.yaml（与 .claude/ 同级，和 agents 隔离）
# ============================================================
# 占位符（agent 运行时按本次软件替换）：
#   {{software}}  软件名，小写、连字符分隔，如 nginx / redis / postgresql
#   {{version}}   软件版本号，如 1.25.3；无法确定时取 unknown_version
# ============================================================
# 路径规则：所有文件都位于 output_dir 下。
#   deploy-install 的输入 = output_dir + install_file
#   deploy-verify  的输入 = output_dir + verify_file
#   下游输入由 output_dir 与指南文件名派生，三端自动对齐，无需手动同步。
# ============================================================

# 公共：输出根目录（指南与结果都放在此目录下，按软件/版本分子目录）
output_dir: "deploy/{{software}}/{{version}}"

# 软件版本无法确定时的占位值
unknown_version: "latest"

# --- deploy-guide 输出文件名（位于 output_dir 下） ---
install_file: "{{software}}-install.md"
verify_file: "{{software}}-verify.md"
target_os: "ubuntu"
default_ubuntu_version: "auto"                 # auto = 自动探测当前机器
clone_workdir_prefix: "/tmp/deploy-guide-"      # git clone 临时目录前缀（仅阅读文档）

# --- deploy-install 输出文件名（位于 output_dir 下；输入 = output_dir + install_file） ---
install_result_file: "{{software}}-install-result.md"
install_issues_file: "{{software}}-install-issues.md"
install_meta_file: "{{software}}-install-meta.json"

# --- deploy-verify 输出文件名（位于 output_dir 下；输入 = output_dir + verify_file） ---
verify_result_file: "{{software}}-verify-result.md"
verify_issues_file: "{{software}}-verify-issues.md"

# --- deploy-archive 输出文件名（位于 output_dir 下） ---
archive_result_file: "{{software}}-archive-result.md"
deploy_list_file: "{{software}}-deploy-list.md"
archive_issues_file: "{{software}}-archive-issues.md"

# --- rpm-check（已有 RPM 包在目标 OS 的可安装性验证；输入=操作指导） ---
# 输出落 rpmcheck/{{target_image}}/ 树——按目标镜像分目录，不与 rpm-build/
# verify/archive 的 rpm/ 树混放；Web 产物区已注册 rpmcheck 根。target_image
# 为目标镜像名 slug（小写、仅 [a-z0-9_]、版本号中 '.' 记为 'p'，
# 如 openEuler 22.03 LTS → openeuler_22p03）。
# target_os* 为门禁匹配值：/etc/os-release 的 ID 与 VERSION_ID 须分别等于
# target_os_id / target_os_version_id，target_os 仅用于报告展示。
rpm_check:
  target_os: "openEuler 22.03 LTS"
  target_os_id: "openEuler"
  target_os_version_id: "22.03"
  result_file: "rpmcheck/{{target_image}}/{{software}}/{{version}}/{{software}}-rpm-check-result.md"
  issues_file: "rpmcheck/{{target_image}}/{{software}}/{{version}}/{{software}}-rpm-check-issues.md"

# --- hce-rpm-check（rpm-check 的 HCE 目标 profile；在 HCE 基础镜像上按操作指导装 RPM 并验证软件可用） ---
# 输出位于 rpmcheck/{{target_image}}/ 树（Web 产物区已注册该根；与 rpm-check
# 的 openeuler_* 目录天然分离）。target_image 按目标镜像：HCE 3.0 → hce_3p0，
# HCE 2.0 → hce_2p0。镜像一律 ARM（鲲鹏），不提供 x86 镜像；按包目标 openEuler
# 版本对标选 HCE 版本：
#   openEuler 22.03 LTS 系（oe2203 / oe2203sp1..sp4）→ HCE 2.0（基于 openEuler
#   22.03 LTS）→ 唯一默认镜像 HCE 2.0 Standard for ARM（04f8c759），不按包架构
#   分支（x86_64/aarch64/noarch 皆用 ARM 镜像）
#   openEuler 24.03 LTS SP1 系（oe2403sp1）→ HCE 3.0（基于 openEuler 24.03 LTS
#   SP1）——区域无 HCE 3.0 ARM 公共镜像，停止要求显式给镜像；tag 无法对标
#   openEuler 版本（如 oe2503/无 tag）同样停止。OS 门禁宽松匹配（ID/名称命中
#   任一即认定 HCE），版本仅记录不校验（2.0/3.0 皆可）。验证通过后按 rpm-archive
#   模板（.claude/agents/rpm-archive.md）生成归档安装脚本 install-rpm.sh，并在全新
#   拉起的初始 HCE ARM 镜像验证机上真实执行实测（快照→忠实执行→冒烟→源恢复与
#   无残留比对），跑通才算交付，落 rpmcheck 树。
hce_rpm_check:
  os_id_match: ["hce", "HCE"]
  os_name_contains: "Huawei Cloud Euler"
  default_image_id_arm: "04f8c759-2a22-412f-8fd5-969ddc61afec"   # Huawei Cloud EulerOS 2.0 Standard 64bit for ARM (aarch64)，唯一默认镜像
  default_flavor_arm: "kc1.xlarge.2"                             # 鲲鹏 ARM 规格
  result_file: "rpmcheck/{{target_image}}/{{software}}/{{version}}/{{software}}-rpm-check-result.md"
  issues_file: "rpmcheck/{{target_image}}/{{software}}/{{version}}/{{software}}-rpm-check-issues.md"
  install_script_file: "rpmcheck/{{target_image}}/{{software}}/{{version}}/install-rpm.sh"   # 归档安装脚本（rpm-archive 模板生成；生成后在初始镜像实测，跑通才交付）

# --- rpm-archive（RPM 流水线归档；输出位于 rpm/ 树，键与 rpm agent 内置默认一致） ---
# package_dir：归档开始时收集的产物包落盘目录（binary/ 构建二进制包、
# source/ 源码包、deps/ 原有依赖包三子目录），Web 界面产物区自动可见可下载
rpm_archive:
  result_file: "rpm/{{software}}/{{version}}/{{software}}-rpm-archive-result.md"
  deliver_list_file: "rpm/{{software}}/{{version}}/{{software}}-rpm-deliver-list.md"
  install_script_file: "rpm/{{software}}/{{version}}/install-rpm.sh"
  package_dir: "rpm/{{software}}/{{version}}/rpms"

# --- 运行时（install / verify / archive 共用） ---
default_server_alias: ""                       # 默认目标机器别名；留空则要求 prompt 提供
ssh_skill_scripts: ".claude/skills/ssh-skill/scripts"
ims_skill_scripts: ".claude/skills/ims-skill/scripts"
ecs_skill_scripts: ".claude/skills/ecs-skill/scripts"
